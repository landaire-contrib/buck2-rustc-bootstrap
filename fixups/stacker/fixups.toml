buildscript.run = false

# The `#[link(name = "stacker")]` of the Windows backend names the C library
# below, which Buck links by path; link.exe cannot find it by name.
[[rustc_flags_select]]
"DEFAULT" = []
"prelude//os:windows" = ["-Zlink-directives=no"]

[['cfg(target_os = "windows")'.cxx_library]]
name = "windows"
srcs = ["src/arch/windows.c"]
compiler_flags = ["-DWINDOWS"]
target_compatible_with = ["prelude//os/constraints:os[windows]"]
